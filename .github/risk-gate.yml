# risk-gate.yml — central config for all primitives
# Copy to .github/risk-gate.yml in your repo

version: 1

risk:
  label: "needs-human-review"
  # Human review required if ANY of these match git diff --name-only
  risky_paths:
    - "api/**"
    - "mcp/**"
    - "auth/**"
    - "src/design-system/**"
    - "skills/**"
    - ".opencode/**"
    - "AGENTS.md"
    - "**/migrations/**"
  risky_patterns:
    # regex matched against changed filename
    - ".*\\.sql$"
  # Tiered blast-radius (Anthropic/OpenAI + Uber Inbox lesson):
  # P0 = blocking human review, P1 = advisory (non-blocking inbox highlight), P2 = safe
  tiers:
    p0_label: "needs-human-review"
    p1_label: "needs-human-advisory"
    # P0 defaults to risky_paths/patterns above when omitted
    p1_paths:
      - "src/**"
      - "lib/**"
      - "packages/**"
      - "internal/**"
    p1_patterns: []
  # non-additive DB changes need manual annotation: add `BREAKING_MIGRATION` in PR body
  require_human_if_pr_body_contains:
    - "BREAKING_MIGRATION"

guardrails:
  coverage_floor: 85
  docs_allowed_dirs:
    - "docs/"
    - ".github/"
  docs_allowed_root_files:
    - "README.md"
    - "AGENTS.md"
  skills_isolation: true

# Plan-first review: review moves to planning, PR proves conformance
# Enforced by scripts/plan-link-gate.sh — deterministic, no LLM key.
plan:
  require_link: true
  min_lines_for_plan: 0 # set e.g. 50 to exempt tiny PRs
  plan_paths:
    - "plans/**"
    - "docs/plans/**"
    - "docs/plan/**"
    - "docs/rfcs/**"
    - "docs/rfc/**"
    - ".github/plans/**"
    - "ref.plan.md"
    - "PLAN.md"
  exempt_paths:
    - "docs/**"
    - "*.md"
    - ".github/copilot-instructions.md"
  exempt_labels:
    - "chore"
    - "deps"
    - "dependabot"

auditor:
  skills_dir: "skills"
  # eval will flag skills where LLM already knows the instruction without the skill
  model: "auto" # uses OPENAI_API_KEY / ANTHROPIC_API_KEY if present, else heuristic

# Handoff definition-of-done: worker handoffs without acceptance criteria bounce.
# Enforced by scripts/handoff-gate.sh — deterministic, no LLM key.
handoff:
  require_verify: true
  ui_patterns:
    - "*.tsx"
    - "*.jsx"
    - "*.css"
    - "*.scss"
    - "**/components/**"
    - "*perf*"
    - "*benchmark*"
  artifact_keywords:
    - "screenshot"
    - "video"
    - "screencast"
    - "perf"
    - "trace"
    - "flamegraph"
    - "preview"
  exempt_paths:
    - "docs/**"
    - "*.md"
    - ".github/copilot-instructions.md"
  exempt_labels:
    - "chore"
    - "deps"
    - "dependabot"

# Retro trail: fix PRs record what makes the error impossible next time.
# Enforced by scripts/prevention-gate.sh — deterministic, no LLM key.
prevention:
  enabled: true
  valid_values: "lint|hook|ci|test|docs|existing-gate|judgment-call"
  exempt_paths:
    - "docs/**"
    - "*.md"
    - ".github/copilot-instructions.md"
  exempt_labels:
    - "chore"
    - "deps"
    - "dependabot"
